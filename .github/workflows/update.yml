name: Update

on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    uses: recmanj/github-workflows/.github/workflows/arch-update.yml@3bee6956c08bda0dfebee60f8cc5e61af15912ed
    permissions:
      contents: write
      pull-requests: write
      actions: write
    with:
      body: 'Release notes: https://github.com/NordSecurity/nordvpn-linux/releases/tag/{version}'
